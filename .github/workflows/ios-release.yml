name: iPhone and iPad IPA

on:
  push:
    branches:
      - 'release/ios-universal-*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the IPA as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TVBOX_INCLUDE_LOCAL_CONFIG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare project
        run: |
          mkdir -p build/DerivedData
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/audit_public_tree.sh
          xcodegen generate
          xcodebuild -version

      - name: Test Spider runner
        run: |
          set -o pipefail
          node --test spider-gateway/test/*.test.mjs 2>&1 | tee build/DerivedData/spider-tests.log

      - name: Find verified tests for unchanged application sources
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          current_id = os.environ['GITHUB_RUN_ID']
          workflow = Path('.github/workflows/ios-release.yml').read_text()
          inputs = ['tvbox', 'tvboxTests', 'tvbox-Tests', 'tvbox.xcodeproj', 'project.yml',
                    'Config/Templates', 'Config/Shared.xcconfig', 'scripts/prepare_local_config.sh',
                    'Vendor/MobileNodeRuntime/Package.swift', 'Vendor/MobileNodeRuntime/Sources',
                    'spider-gateway/src', 'spider-gateway/fixtures',
                    'scripts/prepare_mobile_gateway.sh']
          verified_id = ''
          for run in api(f'repos/{repo}/actions/runs?branch={branch}&per_page=10')['workflow_runs']:
              if str(run['id']) == current_id:
                  continue
              if subprocess.run(['git', 'diff', '--quiet', run['head_sha'], 'HEAD', '--', *inputs]).returncode:
                  continue
              previous = subprocess.check_output(['git', 'show', run['head_sha'] + ':.github/workflows/ios-release.yml'], text=True)
              if re.findall(r'^\s+DEVELOPER_DIR: (.+)$', previous, re.MULTILINE) != re.findall(r'^\s+DEVELOPER_DIR: (.+)$', workflow, re.MULTILINE):
                  continue
              if re.findall(r"['\"](-only-testing:[A-Za-z0-9/_-]+)['\"]", previous) != re.findall(r"['\"](-only-testing:[A-Za-z0-9/_-]+)['\"]", workflow):
                  continue
              jobs = api(f'repos/{repo}/actions/runs/{run["id"]}/jobs')['jobs']
              if any(step['name'] == 'Test iPhone and iPad' and step['conclusion'] == 'success'
                     for job in jobs for step in job.get('steps', [])):
                  verified_id = str(run['id'])
                  print(f'Reusing successful iPhone and iPad tests: {run["html_url"]}')
                  break
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={verified_id}\n')
          PY

      - name: Test iPhone and iPad
        if: steps.verified.outputs.run == ''
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          Path('build/DerivedData/TestResults').mkdir(parents=True, exist_ok=True)
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          available = [device for runtime, group in devices.items() if 'iOS-18-5' in runtime for device in group]
          for family in ['iPhone', 'iPad']:
              device = next(device for device in available if device['name'].startswith(family))
              args = ['xcodebuild', 'test', '-project', 'tvbox.xcodeproj', '-scheme', 'tvbox',
                      '-derivedDataPath', 'build/DerivedData', '-destination', 'platform=iOS Simulator,id=' + device['udid'],
                      '-resultBundlePath', 'build/DerivedData/TestResults/' + family + '.xcresult',
                      '-only-testing:tvbox-Tests/AdaptiveMediaLayoutTests',
                      '-only-testing:tvbox-Tests/PlaybackSleepPreventerTests', 'CODE_SIGNING_ALLOWED=NO']
              args += ['-only-testing:tvbox-Tests/MobileSpiderGatewayTests',
                       '-only-testing:tvbox-Tests/SpiderGatewayTests',
                       '-only-testing:tvbox-Tests/CloudDriveCredentialFileStoreTests',
                       '-only-testing:tvbox-Tests/CloudDriveLoginCredentialExtractorTests']
              with Path('build/DerivedData/' + family + '-tests.log').open('w') as log:
                  print(f'Running tests on {device["name"]}', flush=True)
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  for line in process.stdout:
                      log.write(line)
                      print(line, end='', flush=True)
                  code = process.wait()
              if code:
                  raise SystemExit(code)
          PY

      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          ./package_ios.sh --unsigned 2>&1 | tee build/DerivedData/ios-package.log

      - name: Inspect package and prepare release files
        id: package
        env:
          TEST_SOURCE_RUN: ${{ steps.verified.outputs.run || github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import shutil
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path('build/DerivedData')
          app = root / 'Archives/TVBox-iOS.xcarchive/Products/Applications/TVBox.app'
          with (app / 'Info.plist').open('rb') as source:
              info = plistlib.load(source)
          assert sorted(info['UIDeviceFamily']) == [1, 2], 'IPA must support both iPhone and iPad'
          assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS'], 'Device package required'
          architectures = subprocess.check_output(['lipo', '-archs', str(app / info['CFBundleExecutable'])], text=True).strip()
          assert architectures == 'arm64', architectures
          assert (app / 'Frameworks/NodeMobile.framework/NodeMobile').is_file(), 'Missing standalone script engine'
          assert (app / 'SpiderGateway/mobile-entry.mjs').is_file(), 'Missing mobile script runner'
          assert 'polywasm' in (app / 'LICENSE.node.txt').read_text(), 'Incomplete mobile runtime license'
          version = info['CFBundleShortVersionString']
          build = info['CFBundleVersion']
          name = f'TVBox-iOS-iPadOS-{version}-build{build}-unsigned.ipa'
          package = root / 'Packages' / name
          shutil.copyfile(root / 'Packages/TVBox.ipa', package)
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, 'Corrupt ZIP member'
              assert json.loads(archive.read('Payload/TVBox.app/TVBoxPresets.json')) == [], 'Private configuration must not be published'
              assert not any(entry.endswith(('.p12', '.p8', '.mobileprovision')) for entry in archive.namelist()), 'Signing material in IPA'
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          checksums = root / 'Packages/SHA256SUMS-iOS.txt'
          checksums.write_text(f'{digest}  {name}\n')
          tag = f'ios-v{version}-build{build}'
          notes = root / 'Packages/iOS-release-notes.md'
          notes.write_text(f'''iPhone / iPad 通用版本 {version}，build {build}。最低系统 iOS / iPadOS 17。

          - 修复 iPhone 添加 CatVod 接口时提示配置 Spider Gateway 的问题。
          - 内置手机端脚本引擎，CatVod `.js / .js.md5` 独立运行，无需电脑或外部网关。
          - 支持目录、首页、分类、详情、搜索及播放地址解析；保留 iPhone / iPad 自适应布局。
          - iPhone / iPad 新增「设置 → 网盘设置」，支持粘贴、网页登录保存及清除凭据。
          - 夸克 Cookie 保存或更换后直接用于下一次播放，清除后提示重新登录；修复 Cookie 刷新导致解析失败。

          此 IPA 未使用 Apple 证书签名，不能直接点击安装；请使用支持的侧载工具自行签名。安装包不含接口配置，需自行添加。

          iPhone 和 iPad 的首次导入、脚本执行链路、布局及防休眠 XCTest 已通过，Release 真机架构归档和安装包检查已通过。Android Java/DEX JAR 仍需要兼容运行环境。网络媒体和真机侧载仍需设备验证。

          源码提交：{os.environ['GITHUB_SHA']}
          测试记录：https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['TEST_SOURCE_RUN']}
          SHA-256：`{digest}`
          ''')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\nbuild={build}\nipa={package}\nchecksums={checksums}\nnotes={notes}\n')
          PY

      - name: Publish IPA prerelease
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_BUILD: ${{ steps.package.outputs.build }}
          IPA_PATH: ${{ steps.package.outputs.ipa }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksums }}
          NOTES_PATH: ${{ steps.package.outputs.notes }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --prerelease --latest=false \
            --title "TVBox iPhone / iPad $RELEASE_VERSION (build $RELEASE_BUILD)" --notes-file "$NOTES_PATH"
          gh release upload "$RELEASE_TAG" "$IPA_PATH" "$CHECKSUM_PATH" --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa-build${{ steps.package.outputs.build }}
          path: |
            ${{ steps.package.outputs.ipa }}
            ${{ steps.package.outputs.checksums }}
          retention-days: 14

      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-evidence
          path: |
            build/DerivedData/*.log
            build/DerivedData/TestResults
          retention-days: 7
